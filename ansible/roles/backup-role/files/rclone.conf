[s3-deep-archive]
type                  = s3
provider              = AWS

 env_auth            = true


region                = eu-central-1

# ── Storage class ─────────────────────────────────────────────────────────────
# This sets the DEFAULT class for uploads via this remote.
# The backup.sh script also passes --s3-storage-class explicitly,
# so this acts as a fallback / reminder of intent.
#
#   DEEP_ARCHIVE      $0.00099/GB/mo   180-day min   12–48h retrieval  ← cheapest
#   GLACIER           $0.004/GB/mo      90-day min     3–5h retrieval
#   GLACIER_IR        $0.010/GB/mo      90-day min   instant retrieval
#   STANDARD_IA       $0.0125/GB/mo     30-day min   instant retrieval
#   STANDARD          $0.023/GB/mo      no minimum   instant retrieval
storage_class         = DEEP_ARCHIVE

chunk_size            = 128M
upload_concurrency    = 4  
disable_checksum      = false

