MONITOR_HOST_NAME=$(hostname -f)

ARCHIVE_PREFIX="${MONITOR_HOST_NAME}"
S3_PREFIX="backups/${MONITOR_HOST_NAME}"


BACKUP_SOURCES=(
    "/opt/kumacompose" #Configure backup sources here, e.g.
    "/opt/grafanacompose" #Configure backup sources here, e.g.
)

declare -A DOCKER_COMPOSE_MAP=(
    ["/opt/kumacompose"]="/opt/kumacompose" #Configure backup sources here, e.g.
    ["/opt/grafanacompose"]="/opt/grafanacompose" #Configure backup sources here, e.g.
)


DOCKER_STOP_TIMEOUT=30
STAGING_DIR="/var/ts-backup/staging/"
LOG_DIR="/var/log/ts-backup/${MONITOR_HOST_NAME}"
MAX_LOG_DAYS=90
KEEP_LOCAL_ARCHIVES=3


RCLONE_REMOTE="s3-deep-archive"
S3_BUCKET="tsdb-backup-da"
S3_STORAGE_CLASS="GLACIER_IR"
RCLONE_RETRIES=3

