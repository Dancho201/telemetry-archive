---
- name: Check if rclone is installed
  ansible.builtin.command: which rclone
  register: rclone_check
  changed_when: false
  failed_when: false

- name: Install rclone via apt
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: yes

- name: Create rclone config directory
  ansible.builtin.file:
    path: "{{ rclone_config_dir }}"
    state: directory
    owner: "{{ noto_user }}"
    group: "{{ noto_user }}"
    mode: "0750"

- name: Copy rclone config to shared location
  ansible.builtin.copy:
    src: rclone.conf
    dest: "{{ rclone_config_dir }}/rclone.conf"
    owner: "{{ noto_user }}"
    group: "{{ noto_user }}"
    mode: "0600"

- name: Verify rclone can reach remote
  ansible.builtin.command:
    cmd: "sudo -u {{ noto_user }} rclone --config {{ rclone_config_dir }}/rclone.conf lsf {{ rclone_remote }}:{{ rclone_s3_bucket }}/"
  environment:
    RCLONE_CONFIG: "{{ rclone_config_dir }}/rclone.conf"
  register: rclone_verify
  changed_when: false
  failed_when: rclone_verify.rc != 0

- name: Show rclone verification result
  ansible.builtin.debug:
    var: rclone_verify.stdout_lines