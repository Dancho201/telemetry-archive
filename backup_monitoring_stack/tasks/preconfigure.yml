---
- name: Check if noto user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ noto_user }}"
    fail_key: false

- name: Create noto system user
  ansible.builtin.user:
    name: "{{ noto_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: docker
    append: true
  when: getent_passwd[noto_user] is none

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ noto_user }}"
    group: "{{ noto_user }}"
    mode: "0750"
  loop:
    - "{{ backup_staging_dir }}"
    - "{{ backup_log_dir }}"
    - "{{ backup_dir }}"

- name: Copy backup script and config
  ansible.builtin.copy:
     src: "{{ item }}"
     dest: "{{ backup_dir }}"
     owner: "{{ noto_user }}"
     group: "{{ noto_user }}"
     mode: "0755"
  loop:
    - backup.conf
    - ts-backup.sh

- name: Ensure RCLONE_CONFIG export is in backup script
  ansible.builtin.lineinfile:
    path: "{{ backup_script_dest }}/ts-backup.sh"
    insertafter: "^# ─── Configuration"
    regexp: "^export RCLONE_CONFIG="
    line: "export RCLONE_CONFIG={{ rclone_config_dir }}/rclone.conf"

